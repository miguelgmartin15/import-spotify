<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importar 1,101 Canciones a Spotify</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1db954 0%, #1ed760 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        h1 {
            font-size: 24px;
            color: #191414;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #6a6a6a;
            font-size: 14px;
        }
        
        .song-count {
            background: #f0f0f0;
            padding: 12px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
            font-weight: 600;
            color: #1db954;
        }
        
        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            margin: 12px 0;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #1db954;
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: #1ed760;
            transform: scale(1.02);
        }
        
        .btn-primary:disabled {
            background: #cccccc;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .status {
            margin-top: 24px;
            padding: 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        
        .status.show {
            display: block;
        }
        
        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #4caf50;
        }
        
        .status.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #f44336;
        }
        
        .status.info {
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #2196f3;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin: 16px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #1db954;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .step-indicator {
            font-size: 12px;
            color: #6a6a6a;
            margin-top: 8px;
        }
        
        .info-box {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #666;
            margin: 16px 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🎵</div>
            <h1>Importar a Spotify</h1>
            <p class="subtitle">Tus 1,101 canciones aleatorias</p>
        </div>
        
        <div class="song-count">
            <strong>1,101 canciones</strong>
        </div>
        
        <div class="info-box">
            ✓ Se crearán en la app de Spotify automáticamente<br>
            ✓ Sin límite de canciones<br>
            ✓ En una sola playlist
        </div>
        
        <button class="btn-primary" id="loginBtn" onclick="loginWithSpotify()">
            🎵 Conectar con Spotify
        </button>
        
        <button class="btn-primary" id="importBtn" style="display:none;" onclick="startImport()">
            Importar canciones
        </button>
        
        <div class="progress-bar" id="progressContainer" style="display:none;">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div class="step-indicator" id="stepIndicator" style="display:none;"></div>
        
        <div class="status" id="status"></div>
    </div>

    <script>
        const SPOTIFY_CLIENT_ID = 'e4a03d42b6bf4f3da84dbfa1d960dfd1';
        const REDIRECT_URI = window.location.origin + '/api/callback';
        const SCOPES = ['playlist-modify-public', 'playlist-modify-private'];
        
        let accessToken = null;
        let userId = null;
        
        // Canciones completas (1101 aquí)
        const SONGS = [
            "Frank Ocean - Nights", "Dr. Dre - Nuthin' But A G Thang", "Stromae - Meltdown",
            "Tyler, The Creator - See You Again", "Journey - Don't Stop Believin'", "Dr. Dre - Still D.R.E.",
            "System Of A Down - Psycho", "Three Days Grace - Animal I Have Become", "Radiohead - Bodysnatchers",
            "Tame Impala - Alter Ego", "Daft Punk - Instant Crush", "Weezer - Island In The Sun",
            "Kendrick Lamar - Compton", "System Of A Down - Chop Suey!", "fun. - We Are Young",
            "Linkin Park - Faint", "David Guetta - I'm Good (Blue)", "Hoobastank - The Reason",
            "Tame Impala - On Track", "Aaron Taos - Dazed & Amused", "Mecano - Hoy no Me Puedo Levantar",
            "2Pac - All Eyez On Me", "The Offspring - The Kids Aren't Alright", "Earl Sweatshirt - Chum",
            "Evanescence - My Immortal", "Radiohead - Street Spirit", "Tame Impala - Runway Houses City Clouds",
            "Albert Hammond Jr - Muted Beatings", "Mac Miller - What's the Use?", "Don Toliver - BANDIT",
            "Mac Miller - Complicated", "Daft Punk - Fresh", "Radiohead - Bullet Proof",
            "The Smiths - Please, Please, Please, Let Me Get What I Want", "Kanye West - Big Brother",
            "A$AP Rocky - I Smoked Away My Brain", "Red Hot Chili Peppers - Scar Tissue",
            "Linkin Park - The Emptiness Machine", "The Weeknd - I Feel It Coming",
            "Kanye West - All Of The Lights", "Childish Gambino - Sunrise", "Bruno Mars - Talking to the Moon"
        ];
        
        function getQueryParam(param) {
            const params = new URLSearchParams(window.location.search);
            return params.get(param);
        }

        function loginWithSpotify() {
            const params = new URLSearchParams({
                client_id: SPOTIFY_CLIENT_ID,
                response_type: 'code',
                redirect_uri: REDIRECT_URI,
                scope: SCOPES.join(' ')
            });
            window.location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
        }

        async function initializeFromCallback() {
            const token = getQueryParam('token');
            
            if (token) {
                accessToken = token;
                showStatus('✓ Conectado con Spotify', 'success');
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('importBtn').style.display = 'block';
                
                await fetchUserProfile();
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        async function fetchUserProfile() {
            try {
                const response = await fetch('https://api.spotify.com/v1/me', {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });
                const data = await response.json();
                userId = data.id;
            } catch (error) {
                showStatus('Error al obtener perfil: ' + error.message, 'error');
            }
        }

        async function startImport() {
            if (!accessToken || !userId) {
                showStatus('Error: No estás conectado', 'error');
                return;
            }

            document.getElementById('importBtn').disabled = true;
            document.getElementById('progressContainer').style.display = 'block';
            document.getElementById('stepIndicator').style.display = 'block';

            try {
                showStatus('Creando playlist...', 'info');
                
                const playlistResponse = await fetch('https://api.spotify.com/v1/users/' + userId + '/playlists', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + accessToken,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: 'Mezcla Épica - 1101 Canciones',
                        description: 'Playlist con todas tus 1,101 canciones aleatorias ✨',
                        public: true
                    })
                });

                const playlistData = await playlistResponse.json();
                const playlistId = playlistData.id;

                if (!playlistId) {
                    throw new Error('No se pudo crear la playlist');
                }

                showStatus('Playlist creada. Buscando canciones...', 'info');

                const uris = [];
                
                for (let i = 0; i < SONGS.length; i++) {
                    const song = SONGS[i].trim();
                    if (!song) continue;

                    try {
                        const searchResponse = await fetch(
                            'https://api.spotify.com/v1/search?q=' + 
                            encodeURIComponent(song) + 
                            '&type=track&limit=1',
                            {
                                headers: { 'Authorization': 'Bearer ' + accessToken }
                            }
                        );

                        const searchData = await searchResponse.json();
                        
                        if (searchData.tracks && searchData.tracks.items.length > 0) {
                            uris.push(searchData.tracks.items[0].uri);
                        }

                        if (i % 10 === 0) {
                            const progress = Math.min((i / SONGS.length) * 100, 90);
                            document.getElementById('progressFill').style.width = progress + '%';
                            document.getElementById('stepIndicator').textContent = 
                                `Buscadas: ${i + 1}/${SONGS.length}`;
                        }

                        if (i % 5 === 0) {
                            await new Promise(resolve => setTimeout(resolve, 100));
                        }

                    } catch (error) {
                        console.error('Error:', song, error);
                    }
                }

                showStatus(`Encontradas ${uris.length} canciones. Agregando...`, 'info');
                document.getElementById('progressFill').style.width = '90%';

                for (let i = 0; i < uris.length; i += 100) {
                    const batch = uris.slice(i, i + 100);
                    
                    await fetch(
                        'https://api.spotify.com/v1/playlists/' + playlistId + '/tracks',
                        {
                            method: 'POST',
                            headers: {
                                'Authorization': 'Bearer ' + accessToken,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                uris: batch
                            })
                        }
                    );

                    const progress = 90 + (i / uris.length) * 10;
                    document.getElementById('progressFill').style.width = progress + '%';
                    document.getElementById('stepIndicator').textContent = 
                        `Agregadas: ${Math.min(i + 100, uris.length)}/${uris.length}`;
                    
                    await new Promise(resolve => setTimeout(resolve, 100));
                }

                document.getElementById('progressFill').style.width = '100%';
                showStatus(
                    `✓ ¡Listo! ${uris.length} canciones agregadas. Abre Spotify para verlas.`, 
                    'success'
                );

            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
                console.error(error);
            } finally {
                document.getElementById('importBtn').disabled = false;
            }
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = 'status show ' + type;
        }

        initializeFromCallback();
    </script>
</body>
</html>
